services:
  postgres:
    image: postgres:16-alpine
    container_name: pizza_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pizza_analytics}
      POSTGRES_USER: ${DB_USER:-pizza_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pizza_pw}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pizza_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pizza_admin} -d ${DB_NAME:-pizza_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pizza_db_data:
